# Same services, but Kafka is OCI Streaming (Kafka-compatible, SASL_SSL) instead of the in-cluster broker.
# Create the stream pool, the 7 topics (see contracts/.../TopicSpecs.java for names/partitions) and an
# auth token for a user, then: kubectl create secret generic kafka-sasl -n orbitwatch \
#   --from-literal=KAFKA_SASL_JAAS_CONFIG='org.apache.kafka.common.security.plain.PlainLoginModule required username="<tenancy>/<user>/<streampool-ocid>" password="<auth-token>";'
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
patches:
  - target: { kind: StatefulSet, name: kafka }
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata: { name: kafka, namespace: orbitwatch }
  - target: { kind: Service, name: kafka }
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: kafka, namespace: orbitwatch }
  - target: { kind: ConfigMap, name: orbitwatch-config }
    patch: |
      - op: replace
        path: /data/KAFKA_BOOTSTRAP_SERVERS
        value: "cell-1.streaming.us-phoenix-1.oci.oraclecloud.com:9092"
      - op: replace
        path: /data/KAFKA_SECURITY_PROTOCOL
        value: "SASL_SSL"
      - op: add
        path: /data/KAFKA_SASL_MECHANISM
        value: "PLAIN"
  - target: { kind: Deployment }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value: { secretRef: { name: kafka-sasl } }
