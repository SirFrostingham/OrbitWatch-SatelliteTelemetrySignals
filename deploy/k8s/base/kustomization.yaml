apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  - kafka.yaml
  - ingest-service.yaml
  - propagation-service.yaml
  - analytics-service.yaml
  - gateway-service.yaml
images:
  # Point these at your OCIR repo: <region>.ocir.io/<tenancy-namespace>/orbitwatch/<service>
  - name: orbitwatch/ingest-service
    newName: phx.ocir.io/TENANCY_NAMESPACE/orbitwatch/ingest-service
    newTag: "0.1.0"
  - name: orbitwatch/propagation-service
    newName: phx.ocir.io/TENANCY_NAMESPACE/orbitwatch/propagation-service
    newTag: "0.1.0"
  - name: orbitwatch/analytics-service
    newName: phx.ocir.io/TENANCY_NAMESPACE/orbitwatch/analytics-service
    newTag: "0.1.0"
  - name: orbitwatch/gateway-service
    newName: phx.ocir.io/TENANCY_NAMESPACE/orbitwatch/gateway-service
    newTag: "0.1.0"
