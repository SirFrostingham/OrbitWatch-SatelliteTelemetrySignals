---
apiVersion: apps/v1
kind: Deployment
metadata: { name: propagation-service, namespace: orbitwatch, labels: { app: propagation-service } }
spec:
  replicas: 1
  selector: { matchLabels: { app: propagation-service } }
  template:
    metadata:
      labels: { app: propagation-service }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8082", prometheus.io/path: "/actuator/prometheus" }
    spec:
      containers:
        - name: propagation-service
          image: orbitwatch/propagation-service:latest
          ports: [{ containerPort: 8082, name: http }]
          envFrom: [{ configMapRef: { name: orbitwatch-config } }]
          env:
            - { name: PORT, value: "8082" }

          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: http }, initialDelaySeconds: 20, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: http }, initialDelaySeconds: 60, periodSeconds: 20 }
          resources: { requests: { cpu: "500m", memory: "1.5Gi" }, limits: { memory: "1.5Gi" } }
---
apiVersion: v1
kind: Service
metadata: { name: propagation-service, namespace: orbitwatch }
spec:
  selector: { app: propagation-service }
  ports: [{ port: 8082, targetPort: http }]
