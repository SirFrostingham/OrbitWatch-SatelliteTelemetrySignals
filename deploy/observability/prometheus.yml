global:
  scrape_interval: 10s
scrape_configs:
  - job_name: orbitwatch
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ingest-service:8081']
        labels: { service: ingest }
      - targets: ['propagation-service:8082']
        labels: { service: propagation }
      - targets: ['analytics-service:8083']
        labels: { service: analytics }
      - targets: ['gateway-service:8080']
        labels: { service: gateway }
