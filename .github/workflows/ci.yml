name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: dashboard/package-lock.json }
      - name: Build dashboard
        run: cd dashboard && npm ci && npm run build
      - name: Build + unit/topology tests
        run: mvn -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: surefire-reports, path: "**/target/surefire-reports/*.xml" }
  images:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix: { service: [ingest-service, propagation-service, analytics-service, gateway-service] }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: SERVICE=${{ matrix.service }}
          tags: orbitwatch/${{ matrix.service }}:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
  smoke:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd dashboard && npm ci && npm run build && cd .. && mvn -B -DskipTests package
      - name: Start Kafka
        run: docker compose up -d kafka && timeout 120 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" ow-kafka)" = healthy ]; do sleep 3; done'
      - name: Run services offline and assert the pipeline produces stats + alerts
        run: |
          # `bash <script>` rather than `./<script>`: the repository is authored on Windows, so the
          # scripts are committed mode 100644 and running them directly is "Permission denied" (126).
          bash scripts/run-local.sh --offline

          # Wait for each thing being asserted, never for a proxy. Tick statistics are flushed on a
          # punctuation every tick, but a conjunction alert needs that tick's per-cell windows to
          # close (grace 5 s) and then pass the deduper, so it lands a tick or two later. Asserting
          # on conjunctions the moment stats appear is a race: it failed in CI with CONJUNCTION: 0
          # while the pipeline was perfectly healthy (2026-10-03); measured locally, the first
          # conjunction arrives ~10 s after the first tick statistics.
          timeout 240 bash -c 'until curl -sf "localhost:8080/api/stats/history?last=1" | grep -q objectsPropagated; do sleep 5; done' \
            || { echo "FAIL: no tick statistics after 4 minutes"; exit 1; }
          timeout 240 bash -c 'until [ "$(curl -sf "localhost:8080/api/alerts?type=CONJUNCTION&limit=1" | python3 -c "import json,sys;print(len(json.load(sys.stdin)))")" != "0" ]; do sleep 5; done' \
            || { echo "FAIL: no conjunction alerts after 4 minutes"; exit 1; }

          curl -sf localhost:8080/api/overview | tee overview.json
          python3 - <<'PY'
          import json
          o = json.load(open('overview.json'))
          assert o['trackedObjects'] > 15000, o['trackedObjects']
          assert o['latestStats']['objectsPropagated'] > 15000, o['latestStats']
          assert o['alertCounts']['CONJUNCTION'] > 0, o['alertCounts']
          print('tracked:', o['trackedObjects'], 'conjunctions:', o['alertCounts']['CONJUNCTION'])
          PY
          curl -sf "localhost:8080/api/alerts?type=CONJUNCTION&limit=5" | python3 -c "import json,sys;print(json.load(sys.stdin)[0]['title'])"
      # Diagnostics must never be the thing that fails: a glob that matches nothing used to exit 1
      # and hide the real error.
      - name: Logs on failure
        if: failure()
        run: |
          echo "== service logs =="
          tail -n 100 /tmp/orbitwatch/*.log 2>/dev/null || echo "(no service logs - did run-local.sh start?)"
          echo "== kafka =="
          docker compose ps || true
          docker logs --tail 50 ow-kafka 2>&1 || true
      - name: Stop services
        if: always()
        run: bash scripts/stop-local.sh || true
