spring:
  application:
    name: propagation-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: 1
      compression-type: lz4
      batch-size: 262144
      buffer-memory: 67108864
      properties:
        linger.ms: 50
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
      properties:
        fetch.max.bytes: 52428800
        max.partition.fetch.bytes: 10485760
    listener:
      type: batch
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

orbitwatch:
  propagation:
    tick-ms: ${PROPAGATION_TICK_MS:10000}
    settle-ms: 1500        # defer a tick while element sets arrived within this window (catalogue loading)
    max-deferrals: 3       # ...but never more than this many ticks in a row
    initial-delay-ms: 5000

logging:
  level:
    org.apache.kafka: WARN
